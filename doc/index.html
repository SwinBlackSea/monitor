<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>进程监视器</title>
  <style>
    :root{--ink:#1d1d1f;--muted:#6e6e73;--faint:#949499;--line:#e5e5e7;--soft:#f5f5f7;--green:#2b9a4b;--amber:#d99100;--red:#d92d20;--redsoft:#fff0ee;--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue","Noto Sans CJK SC",sans-serif}
    *{box-sizing:border-box}
    html,body{margin:0;min-width:320px;background:#fff;color:var(--ink);font:14px/1.45 var(--sans);font-variant-numeric:tabular-nums}
    button,input{font:inherit}button:focus-visible{outline:3px solid rgba(0,113,227,.22);outline-offset:2px}input:focus-visible{outline:0}
    .shell{width:min(1180px,calc(100% - 48px));margin:auto;padding:30px 0 40px}
    .titlebar{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:4px 2px 22px}
    h1{margin:0;font-size:25px;line-height:1.15;font-weight:650;letter-spacing:-.025em}.subtitle{display:flex;align-items:center;gap:8px;margin:5px 0 0;color:var(--muted);font-size:13px}.demo-badge{padding:1px 6px;border:1px solid #dedee1;border-radius:999px;color:#77777c;background:#fafafa;font-size:9px;letter-spacing:.04em}
    .dot{position:relative;width:7px;height:7px;flex:none;border-radius:50%}.dot.normal{color:var(--green);background:var(--green)}.dot.warning{color:var(--amber);background:var(--amber)}.dot.offline{color:var(--red);background:var(--red)}
    .dot.pulse:after{content:"";position:absolute;inset:-4px;border:1px solid currentColor;border-radius:50%;animation:heartbeat 2.4s ease-out infinite}
    .machines{display:flex;align-items:flex-end;gap:2px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}.machines::-webkit-scrollbar{display:none}
    .machine{position:relative;display:inline-flex;align-items:center;gap:7px;min-width:max-content;min-height:46px;padding:0 13px 0 17px;border:0;border-radius:9px 9px 0 0;color:var(--muted);background:transparent;cursor:pointer}
    .machine:hover{color:var(--ink);background:#fafafa}.machine.active{color:var(--ink);background:var(--soft);font-weight:590}.machine.active:after{content:"";position:absolute;right:14px;bottom:-1px;left:14px;height:2px;border-radius:2px;background:var(--ink)}
    .rename{display:grid;width:24px;height:24px;margin-left:1px;padding:0;place-items:center;border:0;border-radius:6px;color:var(--faint);background:transparent;opacity:0;cursor:pointer;font-size:13px}.machine:hover .rename,.machine.active .rename{opacity:1}.rename:hover{color:var(--ink);background:#e7e7e9}.machine-add{display:grid;width:40px;min-width:40px;height:40px;margin:0 4px 3px;padding:0;place-items:center;border:0;border-radius:8px;color:var(--muted);background:transparent;cursor:pointer;font-size:22px;font-weight:300}.machine-add:hover{color:var(--ink);background:var(--soft)}
    .statusline{display:flex;align-items:center;min-height:34px;padding:0 2px;color:var(--muted);font-size:12px}.time-colon{display:inline-block;min-width:.28em;text-align:center;animation:clockPulse 1s steps(1,end) infinite}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin:0 0 6px}.segments{display:inline-flex;padding:3px;border-radius:9px;background:#ececee}.segment{min-width:74px;height:32px;padding:0 16px;border:0;border-radius:7px;color:#515154;background:transparent;cursor:pointer}.segment.active{color:var(--ink);background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.13),0 0 0 .5px rgba(0,0,0,.08);font-weight:580}.sort-hint{color:var(--faint);font-size:11px}
    .summary{display:grid;grid-template-columns:128px 110px 100px 164px;align-items:center;min-height:29px;margin-bottom:4px;padding:0 2px}.sum{display:flex;align-items:center;gap:4px;min-width:0;padding:0}.sum-label,.sum-value{overflow:hidden;font-size:11px;font-weight:400;text-overflow:ellipsis;white-space:nowrap}.sum-label{flex:none;color:var(--muted)}.sum-value{letter-spacing:-.005em}.clock-sum{gap:6px}.clock-sum .sum-value{min-width:62px}.collection-dot{margin-right:1px}
    .frame{overflow:hidden;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;table-layout:fixed}th{height:40px;padding:0 16px;color:var(--muted);background:#fafafa;border-bottom:1px solid var(--line);text-align:left;font-size:11px;font-weight:560}td{height:52px;padding:0 16px;border-bottom:1px solid #f1f1f2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    tbody tr{transition:transform .32s cubic-bezier(.22,.61,.36,1),background-color .25s}tbody tr:last-child td{border:0}tbody tr:hover{background:#fafafa}tbody tr.row-updated{animation:rowRefresh .75s ease-out}
    .proc{width:20%}.parent{width:18%}.user{width:12%}.pid{width:10%}.extra{width:12%}.metric{width:13%}.action{width:56px;padding-left:8px;padding-right:10px;text-align:center}.num{text-align:right}.proc-cell{font-weight:400}.proc-sub{display:none}
    .sort-button{display:inline-flex;align-items:center;gap:5px;padding:7px 0;border:0;color:inherit;background:transparent;cursor:pointer;font:inherit;font-weight:inherit}.num .sort-button{justify-content:flex-end;width:100%}.sort-button:hover{color:var(--ink)}.arrow{width:10px;color:var(--ink);font-size:10px}
    .kill{display:inline-grid;width:32px;height:32px;place-items:center;border:0;border-radius:50%;color:#77777b;background:transparent;cursor:pointer;font-size:22px;font-weight:300}.kill:hover{color:var(--red);background:var(--redsoft)}.kill:disabled,.kill[aria-disabled="true"]{color:#c7c7ca;background:transparent;cursor:not-allowed}.kill[aria-disabled="true"]:hover{color:#c7c7ca;background:#f5f5f7}
    .disk-tree .tree-main{width:auto}.disk-tree .tree-size{width:18%}.disk-tree .tree-percent{width:18%}.tree-cell{position:relative}.tree-line{display:flex;align-items:center;min-width:0;padding-left:calc(var(--depth,0)*22px)}.tree-toggle{display:grid;width:28px;height:30px;flex:none;margin-left:-8px;padding:0;place-items:center;border:0;border-radius:6px;color:var(--muted);background:transparent;cursor:pointer}.tree-toggle:hover{color:var(--ink);background:var(--soft)}.tree-toggle:disabled{cursor:default}.tree-toggle:disabled:hover{background:transparent}.chevron{display:block;font-size:12px;transform:rotate(0);transition:transform .18s ease}.tree-toggle.open .chevron{transform:rotate(90deg)}.tree-title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tree-meta{display:block;margin:2px 0 0 20px;overflow:hidden;color:var(--faint);font-size:10px;text-overflow:ellipsis;white-space:nowrap}.tree-row[data-depth]:not([data-depth="0"]) .tree-cell:before{content:"";position:absolute;top:0;bottom:0;left:calc(24px + var(--depth,0)*22px);width:1px;background:#f0f0f1;transform:translateX(-22px)}.usage-wrap{display:flex;align-items:center;justify-content:flex-end;gap:9px}.usage-track{width:44px;height:3px;overflow:hidden;border-radius:3px;background:#ececee}.usage-fill{display:block;height:100%;border-radius:inherit;background:#85858a}.tree-loading td{height:42px;color:var(--faint);font-size:11px}.spinner{display:inline-block;width:11px;height:11px;margin-right:8px;border:1.5px solid #d5d5d7;border-top-color:#737377;border-radius:50%;vertical-align:-2px;animation:spin .7s linear infinite}.tree-warning td{height:38px;color:#846400;background:#fffdf7;font-size:11px}.tree-error td{height:42px;color:var(--red);font-size:11px}
    .empty{padding:72px 24px;color:var(--muted);text-align:center}.foot{display:flex;justify-content:space-between;gap:18px;padding:13px 4px 0;color:var(--faint);font-size:11px}
    dialog{width:min(420px,calc(100% - 32px));padding:0;border:0;border-radius:14px;color:var(--ink);background:#fff;box-shadow:0 22px 60px rgba(0,0,0,.22)}dialog::backdrop{background:rgba(0,0,0,.23)}.dbody{padding:24px 24px 20px}.dbody h2{margin:0 0 9px;font-size:19px}.dbody p{margin:0;color:var(--muted);line-height:1.65}.dbody strong{color:var(--ink)}.form-grid{display:grid;gap:13px;margin-top:18px}.field{display:grid;gap:6px}.field-row{display:grid;grid-template-columns:minmax(0,1fr) 105px;gap:10px}.field label{padding-left:2px;color:var(--muted);font-size:11px}.field input{width:100%;height:40px;padding:0 12px;border:1px solid transparent;border-radius:8px;color:var(--ink);background:#f2f2f4;transition:border-color .15s ease,background-color .15s ease}.field input:hover{background:#ededf0}.field input:focus{border-color:#77777c;background:#fff}.field input:disabled{color:var(--faint);border-color:transparent;background:var(--soft)}.connection-check{display:flex;align-items:center;gap:7px;min-height:34px;margin-top:14px;padding:0 4px 0 2px;border-top:1px solid #eeeeef;border-bottom:1px solid #eeeeef;color:var(--faint);font-size:11px}.check-dot{width:6px;height:6px;border-radius:50%;background:#b5b5b9}.connection-check.working .check-dot{background:var(--amber);animation:heartbeat 1.4s ease-out infinite}.connection-check.success .check-dot{background:var(--green)}.connection-check.error .check-dot{background:var(--red)}.test-connection{margin-left:auto;padding:5px 2px;border:0;color:#515154;background:transparent;cursor:pointer;font-size:11px}.test-connection:hover{color:var(--ink)}.test-connection:disabled{color:var(--faint);cursor:wait}.form-note{margin-top:12px!important;font-size:11px;line-height:1.55!important}.form-status{display:none;margin-top:12px!important;padding:9px 10px;border-radius:7px;font-size:11px;line-height:1.5!important}.form-status.show{display:block}.form-status.working{color:#6b5200;background:#fff8df}.form-status.error{color:#9f241b;background:var(--redsoft)}.dactions{display:flex;justify-content:flex-end;gap:8px;padding:13px 16px;border-top:1px solid var(--line);background:#fafafa}.dbtn{min-width:76px;height:34px;padding:0 14px;border:1px solid #d2d2d4;border-radius:8px;background:#fff;cursor:pointer}.dbtn.primary{color:#fff;border-color:#1d1d1f;background:#1d1d1f}.dbtn.danger{color:#fff;border-color:var(--red);background:var(--red)}.dbtn.remove{margin-right:auto;color:var(--red);border-color:transparent;background:transparent}.dbtn:disabled{opacity:.55;cursor:wait}
    .toast{position:fixed;bottom:22px;left:50%;z-index:3;padding:10px 15px;border-radius:9px;color:#fff;background:rgba(29,29,31,.92);box-shadow:0 8px 28px rgba(0,0,0,.16);opacity:0;pointer-events:none;transform:translate(-50%,8px);transition:.18s;font-size:12px}.toast.show{opacity:1;transform:translate(-50%,0)}.hover-hint{position:fixed;z-index:5;max-width:240px;padding:6px 9px;border-radius:6px;color:#fff;background:rgba(29,29,31,.94);box-shadow:0 5px 16px rgba(0,0,0,.16);opacity:0;pointer-events:none;transform:translate(-50%,-100%) translateY(-6px);transition:opacity .12s;font-size:10px;white-space:nowrap}.hover-hint.show{opacity:1}
    @keyframes heartbeat{0%,55%,100%{opacity:0;transform:scale(.65)}18%{opacity:.45;transform:scale(1)}}@keyframes clockPulse{0%,49%{opacity:1}50%,100%{opacity:.28}}@keyframes rowRefresh{0%{background:#f0f6ff}100%{background:transparent}}@keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:720px){.shell{width:100%;padding:18px 16px 28px}.titlebar{align-items:flex-start;padding:2px 2px 18px}h1{font-size:22px}.machines{margin-left:-16px;margin-right:-16px;padding-left:16px}.machines:after{content:"";flex:0 0 14px}.machine{min-height:44px;padding-left:14px}.rename{opacity:1}.statusline{min-height:34px}.toolbar{margin-bottom:4px}.segments{display:grid;flex:1;grid-template-columns:repeat(3,1fr)}.segment{min-width:0;padding:0 10px}.sort-hint{display:none}.summary{grid-template-columns:repeat(4,minmax(0,1fr));min-height:36px}.sum{display:block;min-width:0;padding:0 4px}.sum:first-child{padding-left:0}.sum-label,.sum-value{display:block;font-size:10px}.sum-value{margin-top:1px}.clock-sum{display:grid;grid-template-columns:11px minmax(0,1fr);column-gap:3px}.clock-sum .collection-dot{grid-row:1/3;margin:0}.clock-sum .sum-label{font-size:9px}.clock-sum .sum-value{min-width:0;margin:0}.frame{margin-left:-1px;margin-right:-1px}th{height:38px;padding:0 12px}td{height:56px;padding:0 12px}.proc{width:auto}.metric{width:94px}.action{width:52px;padding-left:4px;padding-right:4px}.parent,.user,.pid,.extra,.disk-device,.disk-fs{display:none}.proc-sub{display:block;margin-top:2px;overflow:hidden;color:var(--faint);font-size:10px;font-weight:400;text-overflow:ellipsis}.kill{width:36px;height:36px}.disk-tree .tree-size{width:92px}.disk-tree .tree-percent{display:none}.tree-line{padding-left:calc(var(--depth,0)*16px)}.tree-row[data-depth]:not([data-depth="0"]) .tree-cell:before{left:calc(24px + var(--depth,0)*16px);transform:translateX(-16px)}.tree-meta{max-width:210px}.foot{display:block;line-height:1.7}.foot span:last-child{display:none}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}.dot.pulse:after{animation:none;display:none}.time-colon{animation:none}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="titlebar"><div><h1>进程监视器</h1><p class="subtitle">查看各台机器当前占用最高的进程 <span class="demo-badge" id="demoBadge" hidden>模拟数据</span></p></div></header>
    <nav class="machines" id="machines" aria-label="选择机器" role="tablist"></nav>
    <section class="statusline" aria-live="polite"><span id="hostEndpoint">—</span></section>
    <div class="toolbar"><div class="segments" role="tablist" aria-label="资源类型"><button class="segment active" data-view="cpu" role="tab">CPU</button><button class="segment" data-view="memory" role="tab">内存</button><button class="segment" data-view="disk" role="tab">硬盘</button></div><div class="sort-hint">点击表头可排序</div></div>
    <section class="summary" id="summary"></section><section class="frame" id="frame"><div class="empty">正在读取数据…</div></section>
    <footer class="foot"><span id="count"></span><span id="refreshNote">数据每 5 秒自动刷新</span></footer>
  </main>
  <dialog id="killDialog"><div class="dbody"><h2>终止这个进程？</h2><p id="confirmText"></p></div><div class="dactions"><button class="dbtn" id="cancelKill">取消</button><button class="dbtn danger" id="confirmKill">终止进程</button></div></dialog>
  <dialog id="clearDialog"><div class="dbody"><h2>清空这个目录？</h2><p id="clearText"></p></div><div class="dactions"><button class="dbtn" id="cancelClear">取消</button><button class="dbtn danger" id="confirmClear">清空内容</button></div></dialog>
  <dialog id="hostDialog"><div class="dbody"><h2 id="hostDialogTitle">添加机器</h2><p id="hostDialogLead">填写用于采集数据的 SSH 连接信息。</p><div class="form-grid"><div class="field"><label for="hostName">机器名称</label><input id="hostName" maxlength="40" autocomplete="off" placeholder="例如：生产服务器"></div><div class="field"><label for="hostAddress">IP 地址或主机名</label><input id="hostAddress" maxlength="253" autocomplete="off" placeholder="例如：10.0.0.25"></div><div class="field-row"><div class="field"><label for="hostUser">SSH 用户</label><input id="hostUser" maxlength="32" autocomplete="off" placeholder="例如：monitor"></div><div class="field"><label for="hostPort">SSH 端口</label><input id="hostPort" type="number" min="1" max="65535" value="22"></div></div></div><div class="connection-check" id="connectionCheck"><span class="check-dot"></span><span id="connectionCheckText">尚未测试</span><button class="test-connection" id="testHost" type="button">测试连接</button></div><p class="form-note">使用运行 monitor.py 的系统账户和本机 SSH 密钥，不在网页保存 SSH 密码。</p><p class="form-status" id="hostFormStatus" role="status"></p></div><div class="dactions"><button class="dbtn remove" id="removeHost">删除机器</button><button class="dbtn" id="cancelHost">取消</button><button class="dbtn primary" id="saveHost">保存</button></div></dialog>
  <dialog id="deleteDialog"><div class="dbody"><h2>删除这台机器？</h2><p id="deleteText"></p></div><div class="dactions"><button class="dbtn" id="cancelDelete">取消</button><button class="dbtn danger" id="confirmDelete">删除机器</button></div></dialog>
  <div class="toast" id="toast" role="status"></div>
  <div class="hover-hint" id="hoverHint" role="tooltip"></div>
  <script>
    const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const standaloneDemo=location.protocol==="file:";
    if(standaloneDemo)$("#demoBadge").hidden=false;
    const demoStore={
      hosts:[
        {id:"demo-local",name:"开发机",address:"127.0.0.1",port:22,local:true},
        {id:"demo-edge",name:"边缘节点",address:"10.0.8.21",user:"monitor",port:22,local:false},
        {id:"demo-db",name:"数据库",address:"10.0.8.35",user:"monitor",port:22,local:false}
      ],
      ticks:new Map(),snapshots:new Map(),terminated:new Set(),cleared:new Set()
    };
    const demoProcessSeed=[
      ["code","demo","launchd",1,47.8,8.4,24],
      ["python3","demo","code",101,31.6,5.9,12],
      ["node","demo","code",101,22.3,4.7,18],
      ["postgres","postgres","systemd",1,15.1,11.8,14],
      ["chrome","demo","launchd",1,10.7,7.3,42],
      ["dockerd","root","systemd",1,7.9,3.6,31],
      ["nginx","www-data","systemd",1,4.2,1.4,6],
      ["redis-server","redis","systemd",1,2.8,2.7,5],
      ["sshd","root","systemd",1,.6,.3,2]
    ];
    const demoDirectoryTree={
      "/":[["home",78e9],["var",36e9],["opt",14e9],["usr",11e9]],
      "/home":[["demo",61e9],["shared",17e9]],
      "/home/demo":[["projects",34e9],["Downloads",15e9],[".cache",8e9],["Documents",4e9]],
      "/home/demo/projects":[["monitor",13e9],["website",11e9],["archives",7e9],["lab",3e9]],
      "/home/demo/projects/monitor":[["node_modules",6.4e9],["logs",3.6e9],["build",3e9]],
      "/var":[["lib",22e9],["log",9e9],["cache",5e9]],
      "/data":[["backups",94e9],["media",63e9],["exports",27e9]],
      "/data/backups":[["daily",51e9],["weekly",29e9],["monthly",14e9]]
    };
    function demoSnapshot(hostId){
      const hostIndex=Math.max(0,demoStore.hosts.findIndex(host=>host.id===hostId)),tick=(demoStore.ticks.get(hostId)||0)+1;
      demoStore.ticks.set(hostId,tick);
      const processes=demoProcessSeed.map((seed,index)=>{
        const [name,user,parent,ppid,cpu,memory,threads]=seed,pid=1100+hostIndex*1000+index*17;
        const drift=Math.sin(tick*.72+index*1.31+hostIndex)*2.2;
        return {pid,ppid,name,parent_name:parent,user,threads,cpu:Number(Math.max(.1,cpu+drift+hostIndex*1.7).toFixed(1)),memory:Number(Math.max(.1,memory+drift*.12).toFixed(1)),rss_bytes:Math.round(Math.max(.1,memory+drift*.12)*310*1024*1024),started:`Jul 28 ${String(9+index%8).padStart(2,"0")}:${String(index*5).padStart(2,"0")}:00`};
      }).filter(process=>!demoStore.terminated.has(`${hostId}:${process.pid}`));
      const totalRoot=256e9,totalData=1e12,usedRoot=(.36+hostIndex*.08)*totalRoot,usedData=(.31+hostIndex*.05)*totalData;
      const snapshot={
        processes,
        filesystems:[
          {device:"/dev/vda1",type:"ext4",total_bytes:totalRoot,used_bytes:usedRoot,available_bytes:totalRoot-usedRoot,used_percent:Number((usedRoot/totalRoot*100).toFixed(1)),mount:"/"},
          {device:"/dev/vdb1",type:"xfs",total_bytes:totalData,used_bytes:usedData,available_bytes:totalData-usedData,used_percent:Number((usedData/totalData*100).toFixed(1)),mount:"/data"}
        ],
        home_path:"/home/demo",
        summary:{cpu_percent:Number((processes.reduce((sum,process)=>sum+process.cpu,0)/16).toFixed(1)),memory_percent:Number((54+hostIndex*7+Math.sin(tick)*1.3).toFixed(1)),load_1:Number((1.82+hostIndex*.71+Math.sin(tick*.4)*.2).toFixed(2)),load_5:Number((1.61+hostIndex*.62).toFixed(2)),cores:16,process_count:processes.length},
        updated_at:Date.now()
      };
      demoStore.snapshots.set(hostId,snapshot);
      return snapshot;
    }
    function demoCurrentSnapshot(hostId){return demoStore.snapshots.get(hostId)||demoSnapshot(hostId)}
    function demoHostInfo(host,snapshot=demoCurrentSnapshot(host.id)){return {...host,home_path:snapshot.home_path,status:"normal",collection_status:"normal",connectivity_status:"normal",updated_at:snapshot.updated_at}}
    function demoDirectory(hostId,mount,path){
      const snapshot=demoCurrentSnapshot(hostId),filesystem=snapshot.filesystems.find(item=>item.mount===mount),total=filesystem?.total_bytes||1;
      const parentDepth=path===mount?0:path.slice(mount.length).split("/").filter(Boolean).length;
      const children=(demoDirectoryTree[path]||[]).map(([name,rawSize])=>{
        const childPath=`${path.replace(/\/$/,"")}/${name}`||`/${name}`,size=demoStore.cleared.has(`${hostId}:${childPath}`)?0:rawSize,depth=parentDepth+1;
        return {name,path:childPath,size_bytes:size,depth,percent:Number((size/total*100).toFixed(1)),can_delete:depth>=3,delete_min_depth:3};
      }).sort((a,b)=>b.size_bytes-a.size_bytes||a.name.localeCompare(b.name));
      return {host_id:hostId,mount,path,depth:parentDepth,delete_enabled:true,delete_min_depth:3,children};
    }
    function demoChangeResult(host){
      const snapshot=demoSnapshot(host.id);
      return {id:host.id,name:host.name,status:"normal",host:demoHostInfo(host,snapshot),snapshot};
    }
    async function demoApi(path,options={}){
      await wait(45);
      const url=new URL(path,"http://monitor.demo"),method=(options.method||"GET").toUpperCase(),parts=url.pathname.split("/").filter(Boolean);
      let body={};
      try{body=typeof options.body==="string"?JSON.parse(options.body):options.body||{}}catch{}
      if(method==="GET"&&url.pathname==="/api/hosts")return {hosts:demoStore.hosts.map(host=>demoHostInfo(host))};
      if(method==="GET"&&url.pathname==="/api/host-statuses")return {statuses:demoStore.hosts.map(host=>({id:host.id,status:"normal",checked_at:Date.now(),checking:false}))};

    frame.onmouseout=event=>{const target=event.target.closest("[data-hint]");if(target&&!target.contains(event.relatedTarget))hideHoverHint()};
    window.addEventListener("scroll",hideHoverHint,{passive:true});
    frame.onclick=event=>{const sort=event.target.closest("[data-sort]");if(sort){if(state.sortKey===sort.dataset.sort)state.sortDir=state.sortDir==="desc"?"asc":"desc";else{state.sortKey=sort.dataset.sort;state.sortDir=["name","parent","user"].includes(state.sortKey)?"asc":"desc"}renderTable(true);return}const toggle=event.target.closest("[data-tree-toggle]");if(toggle&&!toggle.disabled){toggleDirectory(toggle.dataset.mount,toggle.dataset.path);return}const clear=event.target.closest(".clear-dir");if(clear){if(clear.getAttribute("aria-disabled")==="true"){hideHoverHint();showToast("目录清空功能未启用");return}state.pendingDirectory={hostId:state.hostId,mount:clear.dataset.mount,path:clear.dataset.path,name:clear.dataset.name};$("#clearText").innerHTML=`将永久删除 <strong>${esc(state.pendingDirectory.path)}</strong> 下的全部文件和子目录。<br>目录本身会保留，此操作无法撤销。`;clearDialog.showModal();return}const button=event.target.closest(".kill");if(!button||button.disabled)return;state.pending={pid:Number(button.dataset.pid),name:button.dataset.name};$("#confirmText").innerHTML=`将在 <strong>${esc(activeHost().name)}</strong> 上终止 <strong>${esc(state.pending.name)}</strong>（PID ${state.pending.pid}）。未保存的数据可能会丢失。`;killDialog.showModal()};
    function removeCachedProcess(hostId,pid){const cached=state.cache[hostId];if(!cached)return null;const backup={processes:cached.processes,summary:{...cached.summary}};cached.processes=cached.processes.filter(process=>process.pid!==pid);cached.summary={...cached.summary,process_count:cached.processes.length,cpu_percent:Number((cached.processes.reduce((total,process)=>total+Number(process.cpu||0),0)/Math.max(1,Number(cached.summary.cores||1))).toFixed(1))};cached.updatedAt=Date.now();return backup}
    $("#cancelKill").onclick=()=>killDialog.close();$("#confirmKill").onclick=async()=>{const item=state.pending,hostId=state.hostId,key=`${hostId}:${item.pid}`;state.pendingKills.add(key);const backup=removeCachedProcess(hostId,item.pid);killDialog.close();if(backup&&hostId===state.hostId){applyCachedHost();render(true)}try{await api(`/api/hosts/${encodeURIComponent(hostId)}/processes/${item.pid}/terminate`,{method:"POST"});state.pendingKills.delete(key);showToast(`已终止 ${item.name}`);setTimeout(()=>{if(hostId===state.hostId)refresh({animate:true,refreshHosts:false})},500)}catch(error){state.pendingKills.delete(key);if(backup&&state.cache[hostId]){state.cache[hostId].processes=backup.processes;state.cache[hostId].summary=backup.summary;if(hostId===state.hostId){applyCachedHost();render(true)}}showToast(`终止失败：${error.message}`)}};
    const directoryParent=path=>{const clean=path.replace(/\/+$/,"");const index=clean.lastIndexOf("/");return index<=0?"/":clean.slice(0,index)};
    $("#cancelClear").onclick=()=>clearDialog.close();$("#confirmClear").onclick=async()=>{const target=state.pendingDirectory,button=$("#confirmClear"),label=button.textContent;button.disabled=true;button.textContent="正在清空…";try{const result=await api(`/api/hosts/${encodeURIComponent(target.hostId)}/directories/clear`,{method:"POST",body:JSON.stringify({mount:target.mount,path:target.path})});clearDialog.close();for(const [key,entry] of state.diskTree){if(entry.hostId===target.hostId&&(entry.path===target.path||entry.path.startsWith(`${target.path}/`)))state.diskTree.delete(key)}if(target.hostId===state.hostId){await reloadDirectory(target.mount,directoryParent(target.path));const filesystem=await api(`/api/hosts/${encodeURIComponent(target.hostId)}/filesystems`);if(state.cache[target.hostId]){state.cache[target.hostId].filesystems=filesystem.filesystems;state.cache[target.hostId].updatedAt=filesystem.updated_at;applyCachedHost();renderDiskTable()}}showToast(`已清空 ${target.name}，目录已保留`)}catch(error){showToast(`清空失败：${error.message}`)}finally{button.disabled=false;button.textContent=label}};
    function setHostFormStatus(text,type=""){const status=$("#hostFormStatus");status.textContent=text;status.className=`form-status${text?` show ${type}`:""}`}
    function hostPayload(){return {name:$("#hostName").value.trim(),address:$("#hostAddress").value.trim(),user:$("#hostUser").value.trim(),port:Number($("#hostPort").value)}}
    function validHostPayload(payload){if(!payload.name){setHostFormStatus("请填写机器名称。","error");$("#hostName").focus();return false}if(!payload.address){setHostFormStatus("请填写 IP 地址或主机名。","error");$("#hostAddress").focus();return false}if(!Number.isInteger(payload.port)||payload.port<1||payload.port>65535){setHostFormStatus("SSH 端口必须在 1–65535 之间。","error");$("#hostPort").focus();return false}setHostFormStatus("");return true}
    function installHostResult(result,isNew){state.requestToken++;const host=result.host;state.removedHostIds.delete(host.id);const index=state.hosts.findIndex(item=>item.id===host.id);if(index<0)state.hosts.push(host);else state.hosts[index]=host;state.cache[host.id]={processes:result.snapshot.processes,filesystems:result.snapshot.filesystems,summary:result.snapshot.summary,updatedAt:result.snapshot.updated_at};if(isNew){state.viewByHost[state.hostId]=state.view;state.lastHostId=state.hostId;state.hostId=host.id;state.viewByHost[host.id]="cpu";state.view="cpu";defaultSort()}if(state.hostId===host.id)applyCachedHost();render(false)}
    $("#testHost").onclick=async()=>{const payload=hostPayload();if(!validHostPayload(payload))return;const button=$("#testHost");button.disabled=true;setConnectionCheck("正在测试连接…","working");try{const result=await api("/api/hosts/test",{method:"POST",body:JSON.stringify({...payload,id:state.manageId||""})});setConnectionCheck(`连接成功 · ${result.elapsed_ms} ms`,"success")}catch(error){setConnectionCheck(error.message,"error")}finally{button.disabled=false}};
    $("#hostDialog .form-grid").addEventListener("input",()=>setConnectionCheck("连接信息已修改，请重新测试"));
    $("#cancelHost").onclick=()=>hostDialog.close();$("#saveHost").onclick=async()=>{const payload=hostPayload();if(!validHostPayload(payload))return;const button=$("#saveHost"),label=button.textContent,isNew=!state.manageId;button.disabled=true;button.textContent="正在保存…";setHostFormStatus("");try{const result=await api(isNew?"/api/hosts":`/api/hosts/${encodeURIComponent(state.manageId)}`,{method:isNew?"POST":"PATCH",body:JSON.stringify(payload)});installHostResult(result,isNew);hostDialog.close();showToast(isNew?"机器已添加":"机器信息已更新")}catch(error){setHostFormStatus(error.message,"error")}finally{button.disabled=false;button.textContent=label}};
    function removeHostImmediately(id){const backup={removedId:id,hosts:state.hosts,cache:state.cache,viewByHost:{...state.viewByHost},hostId:state.hostId,lastHostId:state.lastHostId,view:state.view,rows:state.rows,summary:state.summary,updatedAt:state.updatedAt},index=state.hosts.findIndex(host=>host.id===id);if(index<0)return backup;state.requestToken++;state.removedHostIds.add(id);state.hosts=state.hosts.filter(host=>host.id!==id);state.cache={...state.cache};delete state.cache[id];delete state.viewByHost[id];if(state.hostId===id){const fallback=state.hosts.find(host=>host.id===state.lastHostId)||state.hosts.find(host=>state.cache[host.id])||state.hosts[Math.min(index,state.hosts.length-1)];state.hostId=fallback?.id||null;state.lastHostId=null;state.view=state.viewByHost[state.hostId]||"cpu";defaultSort()}if(!applyCachedHost()){state.rows=[];state.summary={};state.updatedAt=0}render(false);return backup}
    function restoreHostState(backup){state.requestToken++;state.removedHostIds.delete(backup.removedId);state.hosts=backup.hosts;state.cache=backup.cache;state.viewByHost=backup.viewByHost;state.hostId=backup.hostId;state.lastHostId=backup.lastHostId;state.view=backup.view;state.rows=backup.rows;state.summary=backup.summary;state.updatedAt=backup.updatedAt;render(false)}
    $("#removeHost").onclick=()=>{const host=state.hosts.find(h=>h.id===state.manageId);if(!host)return;$("#deleteText").innerHTML=`将移除 <strong>${esc(host.name)}</strong> 的监控配置，不会修改或关闭远程服务器。`;hostDialog.close();deleteDialog.showModal()};$("#cancelDelete").onclick=()=>deleteDialog.close();$("#confirmDelete").onclick=async()=>{const id=state.manageId,backup=removeHostImmediately(id);deleteDialog.close();try{await api(`/api/hosts/${encodeURIComponent(id)}`,{method:"DELETE"});showToast("机器已删除");if(state.hostId&&!state.cache[state.hostId])refresh({animate:false,refreshHosts:false})}catch(error){restoreHostState(backup);showToast(`删除失败：${error.message}`)}};
    hostDialog.onkeydown=event=>{if(event.key==="Enter"&&event.target.tagName==="INPUT"){event.preventDefault();$("#saveHost").click()}};
    function showToast(text){const toast=$("#toast");toast.textContent=text;toast.classList.add("show");clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.classList.remove("show"),2600)}
    setInterval(renderClocks,1000);
    setInterval(()=>{if(!document.hidden&&state.view!=="disk")refresh({animate:true,refreshHosts:false})},5000);
    setInterval(()=>{if(!document.hidden)refreshHostStatuses()},30000);
    document.addEventListener("visibilitychange",()=>{if(!document.hidden)refreshHostStatuses()});
    refresh({animate:false,refreshHosts:true,reset:true}).then(refreshHostStatuses);
  </script>
</body>
</html>
